<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Fetch</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        /* Cart Summary Header */
        .cart-status {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 15px;
            width: 80%;
            margin: 15px auto;
            font-weight: bold;
            font-size: 1.1rem;
        }

        table {
            border-collapse: collapse;
            border: 3px solid rgb(31, 193, 19);
            margin: auto;
            width: 80%;
        }

        th, td {
            border: 2px solid black;
            padding: 10px;
            text-align: center;
        }

        thead {
            background-color: #f2f2f2;
        }

        img {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }

        /* Action Buttons */
        .btn {
            padding: 8px 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.85;
        }

        .btn-cart {
            background-color: #ff9800;
            color: white;
        }

        .btn-order {
            background-color: #2e7d32;
            color: white;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <h1>LIST OF PRODUCTS</h1>

    <!-- Global Cart Summary & Checkout -->
    <div class="cart-status">
        <span>🛒 Cart Items: <span id="cart-count">0</span></span>
        <button class="btn btn-order" onclick="placeCartOrder()">Place Order</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>SR.NO</th>
                <th>Title</th>
                <th>IMAGE</th>
                <th>Description</th>
                <th>Category</th>
                <th>Price</th>
                <th>Rating</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="data"></tbody>
    </table>

    <script>
        const url = "https://dummyjson.com/products?limit=10&skip=2";
        const currencyUrl = "https://api.frankfurter.dev/v2/rate/USD/INR";

        let cart = [];
        let productsList = [];

        async function loadProduct() {
            try {
                const res = await fetch(url);
                const data = await res.json();
                productsList = data.products;

                // Fetch exchange rate with a fallback if API fails
                let rate = 83.5; 
                try {
                    const currencyRes = await fetch(currencyUrl);
                    const currencyData = await currencyRes.json();
                    if (currencyData && currencyData.rate) {
                        rate = currencyData.rate;
                    }
                } catch (e) {
                    console.warn("Currency API unavailable, using fallback rate:", rate);
                }

                let rows = "";
                productsList.forEach((product, index) => {
                    const inrPrice = (product.price * rate).toFixed(2);

                    rows += `
                    <tr>
                        <td>${index + 1}</td>
                        <td><strong>${product.title}</strong></td>
                        <td>
                            <img src="${product.images[0]}" alt="${product.title}">
                        </td>
                        <td>${product.description}</td>
                        <td>${product.category}</td>
                        <td>₹ ${inrPrice}</td>
                        <td>★ ${product.rating}</td>
                        <td>
                            <button class="btn btn-cart" onclick="addToCart(${product.id}, '${escapeQuotes(product.title)}', ${inrPrice})">
                                Add To Cart
                            </button>
                        </td>
                    </tr>`;
                });

                document.getElementById("data").innerHTML = rows;

            } catch (error) {
                console.error("Failed to load products:", error);
            }
        }

        // Helper to prevent syntax errors from titles containing quotes
        function escapeQuotes(str) {
            return str.replace(/'/g, "\\'");
        }

        // Add to Cart handler
        function addToCart(id, title, price) {
            cart.push({ id, title, price: Number(price) });
            document.getElementById("cart-count").innerText = cart.length;
            alert(`"${title}" has been added to your cart!`);
        }

        // Single Place Order handler for all cart items
        function placeCartOrder() {
            if (cart.length === 0) {
                alert("Your cart is empty! Add some products before placing an order.");
                return;
            }

            const totalAmount = cart.reduce((sum, item) => sum + item.price, 0).toFixed(2);
            const confirmed = confirm(`You have ${cart.length} item(s) in your cart.\nTotal Amount: ₹${totalAmount}\n\nDo you want to confirm your order?`);
            
            if (confirmed) {
                alert(`🎉 Order placed successfully for ${cart.length} item(s) worth ₹${totalAmount}!`);
                cart = []; // Reset cart
                document.getElementById("cart-count").innerText = "0";
            }
        }

        loadProduct();
    </script>
</body>
</html>
